AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TaskFlow - Secure Serverless Task Management Application.
  Cognito + API Gateway (REST) + Lambda + DynamoDB + CloudWatch log groups.
  Cost-conscious defaults: on-demand DynamoDB, Cognito Lite tier, 7-day log retention,
  X-Ray / API cache / WAF / CloudFront all off. Review docs/cost-and-readiness.md before deploying.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage name.
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    AllowedPattern: '^https?://[^*\s,'']+$'
    ConstraintDescription: Must be a single http(s) origin without wildcards, e.g. https://app.example.com
    Description: Allowed CORS origin (Vite dev server by default). Wildcards are rejected.
  EnableXRay:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AWS X-Ray tracing (optional, may incur cost beyond Free Tier).
  EnableApiCache:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable API Gateway cache cluster (NOT Free Tier eligible - keep false).
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch Logs retention in days for every Lambda log group (never "keep forever").

Conditions:
  XRayOn: !Equals [!Ref EnableXRay, 'true']
  ApiCacheOn: !Equals [!Ref EnableApiCache, 'true']

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 128
    Timeout: 10
    Tracing: !If [XRayOn, Active, PassThrough]
    Environment:
      Variables:
        TABLE_NAME: !Ref TasksTable
        LOG_LEVEL: INFO
        ALLOWED_ORIGIN: !Ref FrontendOrigin
    CodeUri: backend/src/

Resources:
  # ---------- Authentication ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub taskflow-${Stage}-users
      UserPoolTier: LITE # cheapest tier; new pools otherwise default to ESSENTIALS. 10,000 free MAU either way.
      DeletionProtection: INACTIVE # so `sam delete` can remove the pool after the demo
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub taskflow-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false # public SPA client, no secret
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # ---------- Database ----------
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub taskflow-${Stage}-tasks
      BillingMode: PAY_PER_REQUEST # on-demand: no idle cost
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: userId # Cognito 'sub' - isolates each user's data
          KeyType: HASH
        - AttributeName: taskId
          KeyType: RANGE
      # No SSESpecification on purpose: DynamoDB always encrypts at rest with an AWS-owned key
      # at no cost. `SSEEnabled: true` would switch to the aws/dynamodb KMS key and add KMS charges.
      DeletionProtectionEnabled: false # so `sam delete` can remove the table after the demo
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false # enable in prod (extra cost)

  # ---------- API ----------
  TaskApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub taskflow-${Stage}-api
      StageName: !Ref Stage
      TracingEnabled: !If [XRayOn, true, false]
      CacheClusterEnabled: !If [ApiCacheOn, true, false]
      CacheClusterSize: !If [ApiCacheOn, '0.5', !Ref AWS::NoValue]
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Cors:
        AllowOrigin: !Sub "'${FrontendOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      # Authorizer rejections (401/403) and gateway errors are generated by API Gateway, not Lambda,
      # so they need CORS headers here or the browser reports a CORS failure instead of the real status.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ---------- CloudWatch log groups (explicit, with finite retention) ----------
  CreateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/taskflow-${Stage}-create-task
      RetentionInDays: !Ref LogRetentionDays

  ListTasksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/taskflow-${Stage}-list-tasks
      RetentionInDays: !Ref LogRetentionDays

  UpdateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/taskflow-${Stage}-update-task
      RetentionInDays: !Ref LogRetentionDays

  DeleteTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/taskflow-${Stage}-delete-task
      RetentionInDays: !Ref LogRetentionDays

  # ---------- Lambda functions (one least-privilege DynamoDB action each) ----------
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.create_task.handler
      LoggingConfig:
        LogGroup: !Ref CreateTaskLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref TaskApi, Path: /tasks, Method: post }

  ListTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.list_tasks.handler
      LoggingConfig:
        LogGroup: !Ref ListTasksLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref TaskApi, Path: /tasks, Method: get }

  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.update_task.handler
      LoggingConfig:
        LogGroup: !Ref UpdateTaskLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref TaskApi, Path: '/tasks/{taskId}', Method: put }

  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.delete_task.handler
      LoggingConfig:
        LogGroup: !Ref DeleteTaskLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:DeleteItem]
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref TaskApi, Path: '/tasks/{taskId}', Method: delete }

  # Optional (documented only, not defined): AWS WAF WebACL, CloudFront + S3 hosting.

Outputs:
  ApiUrl:
    Description: Base URL of the REST API
    Value: !Sub https://${TaskApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref TasksTable
